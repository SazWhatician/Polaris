name: Eval

# Manual dispatch only until we have a hosted eval rig with a test corpus
# pre-indexed. See evals/README.md for the plan to flip this to "on PR
# touching retrieval/prompts/rag" in Phase 4+.
on:
  workflow_dispatch:
    inputs:
      top_k:
        description: "Retrieval top_k (default 5)"
        required: false
        default: "5"

jobs:
  eval:
    name: eval · golden set
    runs-on: ubuntu-latest
    env:
      POLARIS_EVAL_TOP_K: ${{ github.event.inputs.top_k }}
      POLARIS_API_BASE: ${{ secrets.POLARIS_EVAL_API_BASE }}
      POLARIS_EVAL_BEARER: ${{ secrets.POLARIS_EVAL_BEARER }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_JUDGE_MODEL: ${{ secrets.GROQ_JUDGE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install httpx==0.27.2 groq==0.13.0
      - name: Run eval
        run: python -m evals.runners.run_eval
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/*.md
